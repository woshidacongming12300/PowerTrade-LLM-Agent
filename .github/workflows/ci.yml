name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manual runs

jobs:
  # ---------------------------------------------------------------
  # Unit + integration tests (no credentials needed; live-model tests
  # are auto-skipped via pytest markers when DASHSCOPE_API_KEY is absent)
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default PyPI wheel bundles CUDA (~2 GB) and
          # makes this job needlessly slow. The CPU wheel satisfies the
          # `torch>=2.2` requirement, so the later install keeps it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu -q
          pip install pytest -q
          pip install -r requirements.txt -q

      - name: Run test suite
        env:
          HF_HUB_OFFLINE: "1" # never let CI hang on HuggingFace downloads
        run: python -m pytest -v

  # ---------------------------------------------------------------
  # Agent evaluation smoke test — runs only when DashScope credentials
  # are provided as a repo secret (DASHSCOPE_API_KEY).
  #
  # NOTE: gate this job with a repository VARIABLE, because the `secrets`
  # context is NOT available in a job-level `if` (it would silently never
  # run). The secret itself is checked inside the job, which skips
  # gracefully so the workflow stays green without credentials.
  #
  # Enable: Settings → Secrets and variables → Actions
  #   - Secret:   DASHSCOPE_API_KEY = sk-...
  #   - Variable: RUN_EVAL = true
  # ---------------------------------------------------------------
  eval:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ vars.RUN_EVAL == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu -q
          pip install -r requirements.txt -q

      - name: Run agent evaluation (quick, no judge)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          HF_HUB_OFFLINE: "1"
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::notice title=Eval skipped::DASHSCOPE_API_KEY secret is not set."
            exit 0
          fi
          python -u eval/run_eval.py --quick --no-judge --timeout 150

      - name: Upload evaluation report
        if: ${{ hashFiles('eval_report.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval_report
          path: eval_report.md

  # ---------------------------------------------------------------
  # Lightweight sanity checks: Python syntax + import smoke
  # ---------------------------------------------------------------
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all modules
        run: |
          python -m compileall -q api agent algorithms eval memory model observability rag utils
